---
# Joué par `dsoxlab run` avant d'ouvrir la session : il pose le namespace et
# un client, et retire ce qu'un passage précédent aurait laissé.
#
# Transposé de K8sExamLab, dont les six checks lisaient des specs sans jamais
# faire de requête : ici les Pods répondent leur nom, et le client compte
# ceux qui répondent. Confronté à Kubernetes 1.37 le 2026-09-15.
- name: Préparer le lab ckad-expose-service
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle, le cluster kubeadm du catalogue
      ansible.builtin.include_tasks: ../../shared/kubeadm-cluster.yml

    - name: Poser la situation du lab
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

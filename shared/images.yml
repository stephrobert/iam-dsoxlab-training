# Les images du socle, épinglées PAR DIGEST, relevées sur les registres.
#
# POURQUOI CE FICHIER EXISTE
#
# Un `image:tag` sans digest ne décrit pas ce qui tourne : un tag se déplace,
# et deux apprenants qui jouent le même lab à deux semaines d'écart peuvent
# obtenir deux Keycloak différents. Le digest, lui, nomme un contenu, et il est
# vérifié par le démon au moment du `pull`.
#
# Les versions vivent ICI, une seule fois, avec la date de leur relevé. Le
# Compose et les playbooks les lisent, ils ne les recopient pas : une valeur
# qu'il faut penser à recopier finit toujours par mentir.
#
# RELEVÉ LE 2026-10-16, à la source, sur quay.io et Docker Hub.
#
# Les versions que les leçons du site ont jouées sont en commentaire : l'écart
# entre ce que la leçon montre et ce que le lab fait tourner doit se voir, et
# se décider, pas se découvrir en jouant.

keycloak:
  # Dernière version stable au moment du relevé. Les leçons du site ont été
  # jouées en 26.7.0, donc un écart de deux versions mineures : 26.8.0 passe
  # l'API SCIM native en « supported » et 26.6 les Workflows de gouvernance,
  # deux fonctions dont les labs 08 et 13 se servent. Jouer les labs sur 26.8
  # est donc un choix, pas une dérive.
  version: "26.8.1"
  image: "quay.io/keycloak/keycloak"
  digest: "sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244"
  releve_le: "2026-10-16"
  # Port de gestion, où vivent la santé et les métriques. Ce n'est PAS le port
  # de l'application, et la fiche du lab 02 fait porter un test là-dessus.
  port_gestion: 9000

postgres:
  # La documentation de Keycloak 26.8 donne, mot pour mot :
  #
  #   PostgreSQL | postgres | Tested Version 18 | Supported 18.x, 17.x, 16.x, 15.x, 14.x
  #
  # On prend donc 18, qui est la version que KEYCLOAK LUI-MÊME TESTE, et le
  # dernier correctif publié de cette majeure. 14 à 17 restent supportés, et
  # c'est le repli si un défaut apparaissait.
  #
  # Écart assumé avec les essais des leçons : le `compose.yaml` de
  # `preparation/scripts-executes/production/files/` tourne sur
  # `postgres:16-alpine`, qui est supporté mais n'est pas la version testée.
  # Jouer les labs sur la version testée par l'éditeur est le choix le plus
  # sûr, et l'écart est noté pour qu'il ne se découvre pas en route.
  #
  # Une première lecture partielle de cette page m'avait fait croire que 16
  # n'était pas supporté, ce qui était faux : la page liste les versions dans
  # une colonne du tableau, et un grep sur le texte aplati ne rend que la
  # version testée.
  version: "18.6"
  image: "docker.io/library/postgres"
  digest: "sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336"
  releve_le: "2026-10-16"

lldap:
  # LLDAP publie des tags datés ET des tags sémantiques : on prend le
  # sémantique, qui dit quelque chose. La variante Debian plutôt qu'Alpine,
  # pour que `ldapsearch` et les outils du conteneur se comportent comme dans
  # la leçon.
  #
  # Attention : LLDAP n'est PAS un fournisseur OIDC. L'OIDC vient de l'IdP
  # placé devant lui, et un lab qui l'oublierait enseignerait un faux.
  version: "v0.6.3-debian"
  image: "docker.io/lldap/lldap"
  digest: "sha256:2f208d7dc45d0b01648ab9c869fa6f65b843a8c9647e99dd929739f5a51a945b"
  releve_le: "2026-10-16"
  # Ports relevés en lab par les auteurs des leçons.
  ports:
    ldap: 3890
    ldaps: 6360
    web: 17170

# ── Images du lab iam-14, qui branche une plateforme sur l'IdP ───────────────
#
# Elles ne sont PAS du socle : seul ce lab les tire, et son nettoyage les
# laisse dans le cache sans rien faire tourner. Elles vivent ici quand même,
# parce que la raison d'épingler par digest ne change pas d'un lab à l'autre.
#
# RELEVÉ LE 2026-10-16, sur Docker Hub.

k3s:
  # Le cluster de test du lab 14, joué par k3d. La version suit la stable de
  # Kubernetes au relevé (`dl.k8s.io/release/stable.txt` rendait v1.37.1).
  #
  # CE QUI DÉCIDE DE CETTE VERSION, et qu'il faut savoir avant de la changer :
  # en 1.37, les drapeaux `--oidc-issuer-url` et compagnie n'apparaissent plus
  # dans la ligne de commande de l'apiserver. Seule la CONFIGURATION STRUCTURÉE
  # (`--authentication-config`, apiVersion apiserver.config.k8s.io/v1beta1)
  # existe, et elle REFUSE un issuer en http, mot pour mot :
  #
  #   invalid authentication configuration: jwt[0].issuer.url: Invalid value:
  #   "http://10.10.80.11:8080/realms/formation": URL scheme must be https
  #
  # C'est la raison pour laquelle ce lab pose un accès TLS devant Keycloak.
  version: "v1.37.1-k3s1"
  image: "docker.io/rancher/k3s"
  digest: "sha256:8d298cb81ca94e875d31e804e5aa10b56355d1d7d95d7e1ef8a8d9239f15ada0"
  releve_le: "2026-10-16"
  # Le binaire qui pilote le cluster. Ce n'est pas une image : il est
  # téléchargé par le setup du lab, et sa version est épinglée pour la même
  # raison. `--host-alias` exige 5.6 ou plus récent.
  k3d_version: "v5.9.0"
  kubectl_version: "v1.37.1"

grafana:
  # L'outil de plateforme que le lab branche sur le même realm. Choisi parce
  # qu'il parle OIDC générique, qu'il pèse 150 Mo, et qu'il montre un piège
  # réel : sans `use_pkce`, il n'envoie pas de `code_challenge`, le client qui
  # exige PKCE refuse, et l'erreur part AU CALLBACK, donc elle se déguise en
  # simple retour à la page de connexion.
  version: "12.3.1"
  image: "docker.io/grafana/grafana"
  digest: "sha256:7c064e627d9cb50c3485c9ded5ca0222de89a08e41403322a0c3ca6f1777a8d1"
  releve_le: "2026-10-16"

nginx:
  # L'accès TLS devant Keycloak, que le lab 14 pose et que son nettoyage
  # retire. Il ne sert qu'à donner à l'IdP un issuer en https, ce que le
  # cluster exige. Le socle, lui, reste en HTTP : voir l'en-tête de
  # `compose-socle.yaml`.
  version: "1.29-alpine"
  image: "docker.io/library/nginx"
  digest: "sha256:3bcf852aed06467cf075c6105892e4d5a6ebbbafa0ce22d35062db9e90ddef4c"
  releve_le: "2026-10-16"

# ── Le couple de versions du lab iam-09, qui monte Keycloak ─────────────────
#
# RELEVÉ LE 2026-10-16 sur quay.io. Le lab pose une instance DÉDIÉE en
# `avant` et demande de la monter en `apres`. Le socle, lui, reste sur la
# version de `keycloak:` ci-dessus : une base migrée ne redescend pas, et
# monter le socle laisserait les treize autres labs dans un état qu'ils n'ont
# pas demandé.
#
# POURQUOI CE COUPLE : 26.7.5 est le dernier correctif de la 26.7, et 26.8.1
# la stable au relevé. C'est donc un saut de MINEURE, celui qui migre le
# schéma, et non un saut de correctif qui ne prouverait rien.
#
# CE QUE LES NOTES DE MIGRATION DE LA 26.8 ANNONCENT, et qui vaut d'être lu
# avant de changer ce couple : au-delà de 300 000 lignes dans
# OFFLINE_USER_SESSION, la migration automatique SAUTE la création d'un index
# et la journalise pour application à la main. Un service qui redémarre « sans
# erreur » peut donc avoir un index en moins. Le lab ne le reproduit pas (il
# faudrait 300 000 sessions), mais son tutoriel le nomme.
keycloak_montee:
  avant:
    version: "26.7.5"
    image: "quay.io/keycloak/keycloak"
    digest: "sha256:37dbaf6f0722c9ec246335f36e1ef8b2e6cb960f7c27e0d8c615121a3d475a85"
  apres:
    version: "26.8.1"
    image: "quay.io/keycloak/keycloak"
    digest: "sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244"
  releve_le: "2026-10-16"

# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
#
# Canonique en anglais, comme le contrat l'exige. `lab.fr.yaml` surcharge le
# titre et la description pour le lecteur francophone, et rien d'autre.
#
# `lab_type: capstone` : c'est une ÉPREUVE, et il n'y a donc PAS de
# `challenge/hints.yaml`. Un indice mesurerait autre chose que ce qu'on veut
# mesurer.
id: iam-epreuve-n1
title: "Level 1 exam: stand up a provider, federate, wire an app and an API"
description: |
  No hints. Starting from a machine with Docker, a populated directory and two
  witnesses that know nothing, install a durable identity provider, federate
  the directory with its groups, wire the witness application in OIDC with
  PKCE, and close the witness API so that it checks signature, issuer,
  audience, expiry and scope. Graded on the state of the system, as the four
  labs it draws on are.
section: niveau-1
level: niveau-1
lab_type: capstone
difficulty: advanced
estimated_time: "90m"
skills:
  - keycloak
  - ldap
  - oidc
  - pkce
  - api
distros:
  - ubuntu24
doc_url: https://blog.stephane-robert.info/docs/services/identite/epreuve-niveau-1/
certification_tags: []
# Le pourcentage DU BARÈME à atteindre pour que l'épreuve soit réussie. Rendu
# en verdict par `dsoxlab submit`. Fixé après avoir joué l'épreuve en entier.
exam_passing_score: 70
runtime:
  type: vm
  targets:
    - name: idp
      host: idp.lab
      label_en: "Ubuntu 24.04"
      label_fr: "Ubuntu 24.04"
  default: idp
validation:
  functional: true
  # Une API ouverte, un flux implicite, un octroi direct laissé actif : les
  # trois sont des défauts de sécurité, et l'épreuve les note comme tels.
  security: true
  persistence_after_reboot: false

---
# Joué par `dsoxlab run` avant d'ouvrir la session.
#
# Les versions de l'outillage sont lues dans `shared/images.yml`, sous
# `realm_as_code`, et passées au script en variables d'environnement. Celle du
# provider ne sert qu'à l'écrire dans le cahier des charges : c'est l'apprenant
# qui la déclare dans son `provider.tf`.
- name: Préparer le lab iam-10-realm-as-code
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle IAM
      ansible.builtin.include_tasks: ../../shared/socle-iam.yml

    - name: Lire les versions épinglées
      ansible.builtin.include_vars:
        file: ../../shared/images.yml
        name: images

    - name: Poser la situation du lab
      # La trace va dans un journal SUR la machine, avec `set -x` : dsoxlab ne
      # rend que « non-zero return code » quand un script de mise en situation
      # échoue, et c'est ce fichier que le validateur relit pour dire pourquoi.
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        TF_VERSION: "{{ images.realm_as_code.terraform.version }}"
        PROVIDER_VERSION: "{{ images.realm_as_code.provider_keycloak.version }}"

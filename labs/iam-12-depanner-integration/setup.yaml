---
# Joué par `dsoxlab run` avant d'ouvrir la session.
#
# CE SETUP CASSE QUELQUE CHOSE, À DESSEIN. C'est le seul du catalogue dans ce
# cas, et son script vérifie à la fin que l'intégration est bien hors service :
# un lab de dépannage dont tout fonctionne serait vert avant tout travail.
- name: Préparer le lab iam-12-depanner-integration
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle IAM
      ansible.builtin.include_tasks: ../../shared/socle-iam.yml

    - name: Poser la situation du lab, et casser l'intégration
      # La trace va dans un journal SUR la machine, avec `set -x` : dsoxlab ne
      # rend que « non-zero return code » quand un script de mise en situation
      # échoue, et c'est ce fichier que le validateur relit pour dire pourquoi.
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash

---
# Joué par `dsoxlab run` avant d'ouvrir la session.
#
# Les versions ne sont PAS écrites ici : elles sont lues dans
# `shared/images.yml` et passées au script en variables d'environnement. Une
# version recopiée dans deux fichiers finit toujours par diverger, et c'est
# justement la version du cluster qui décide du mécanisme d'authentification
# disponible.
- name: Préparer le lab iam-14-plateforme
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle IAM
      ansible.builtin.include_tasks: ../../shared/socle-iam.yml

    - name: Lire les versions épinglées
      ansible.builtin.include_vars:
        file: ../../shared/images.yml
        name: images

    - name: Poser la situation du lab
      # La trace va dans un journal SUR la machine, avec `set -x` : dsoxlab ne
      # rend que « non-zero return code » quand un script de mise en situation
      # échoue, et c'est ce fichier que le validateur relit pour dire pourquoi.
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        K3D_VERSION: "{{ images.k3s.k3d_version }}"
        KUBECTL_VERSION: "{{ images.k3s.kubectl_version }}"
        IMAGE_K3S: "{{ images.k3s.image }}:{{ images.k3s.version }}@{{ images.k3s.digest }}"
        # Le même nom sans digest, pour retaguer l'image en local : c'est sous
        # ce nom que l'apprenant la demandera en créant son cluster.
        TAG_K3S: "{{ images.k3s.image | regex_replace('^docker.io/', '') }}:{{ images.k3s.version }}"
        IMAGE_GRAFANA: >-
          {{ images.grafana.image }}:{{ images.grafana.version
          }}@{{ images.grafana.digest }}
        IMAGE_NGINX: >-
          {{ images.nginx.image }}:{{ images.nginx.version
          }}@{{ images.nginx.digest }}

# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
#
# Canonique en anglais, comme le contrat l'exige. `lab.fr.yaml` surcharge le
# titre et la description pour le lecteur francophone, et rien d'autre.
id: iam-14-plateforme
title: "Make a cluster and a tool authenticate against the provider"
description: |
  Configure a test cluster's API server to trust the identity provider, give a
  group its rights through RBAC without ever granting cluster-admin, and wire a
  platform tool onto the same realm. Graded on the cluster accepting a token
  from the provider, the rights following the group, and both failure cases
  being caught.
section: niveau-2
level: niveau-2
lab_type: lab
difficulty: advanced
estimated_time: "60m"
skills:
  - keycloak
  - kubernetes
  - rbac
  - oidc
distros:
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/services/identite/keycloak/plateforme/
certification_tags: []
runtime:
  type: vm
  targets:
    - name: idp
      host: idp.lab
      label_en: "Ubuntu 24.04"
      label_fr: "Ubuntu 24.04"
  default: idp
validation:
  functional: true
  # Un groupe lié à cluster-admin donne la machine entière à qui entre dans ce
  # groupe, et un claim de groupes absent laisse un compte authentifié sans
  # droits, ce qui ressemble à une panne et n'en est pas une.
  security: true
  persistence_after_reboot: false

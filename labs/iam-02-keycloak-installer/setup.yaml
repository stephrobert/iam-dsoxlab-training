---
# Joué par `dsoxlab run` avant d'ouvrir la session.
#
# CE LAB EST LE SEUL DU CATALOGUE À N'INCLURE QUE LA COUCHE MACHINE.
#
# Son sujet est d'installer Keycloak : lui livrer le socle IAM lui retirerait
# son objet. Il reçoit donc Docker, Compose et les outils, et rien de plus.
# Les quinze autres labs incluent `shared/socle-iam.yml`, qui inclut lui-même
# la couche machine.
#
# Si un jour ce lab commençait à échouer parce que Keycloak est déjà là, c'est
# que quelqu'un a ajouté le socle ici. La bonne correction est de le retirer,
# pas d'adapter les tests.
- name: Préparer le lab iam-02-keycloak-installer
  hosts: lab_target
  become: true
  tasks:
    - name: Installer la couche machine, sans le socle IAM
      ansible.builtin.include_tasks: ../../shared/machine-docker.yml

    - name: Poser la situation du lab
      # La trace va dans un journal SUR la machine, avec `set -x` : dsoxlab ne
      # rend que « non-zero return code » quand un script de mise en situation
      # échoue, et c'est ce fichier que le validateur relit pour dire pourquoi.
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash

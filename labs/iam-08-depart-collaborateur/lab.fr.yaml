title: "Couper les accès de quelqu'un qui part"
description: |
  Désactiver un compte sans le supprimer, fermer les sessions qui survivent à
  la désactivation, retirer les groupes, et produire le fichier de revue qu'un
  auditeur peut lire. Noté sur ce qui reste ouvert ensuite, et sur le compte
  encore présent pour être audité.

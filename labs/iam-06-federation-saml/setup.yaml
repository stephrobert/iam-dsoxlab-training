---
# Joué par `dsoxlab run` avant d'ouvrir la session.
#
# Le fournisseur de service témoin est un SECOND REALM du même Keycloak. Le
# script de mise en situation explique ce choix en détail ; en un mot, c'est le
# seul fournisseur de service SAML à la fois maintenu, déjà épinglé par digest,
# et qui montre les deux côtés du protocole.
- name: Préparer le lab iam-06-federation-saml
  hosts: lab_target
  become: true
  tasks:
    - name: Installer le socle IAM
      ansible.builtin.include_tasks: ../../shared/socle-iam.yml

    - name: Poser la situation du lab
      # La trace va dans un journal SUR la machine, avec `set -x` : dsoxlab ne
      # rend que « non-zero return code » quand un script de mise en situation
      # échoue, et c'est ce fichier que le validateur relit pour dire pourquoi.
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
